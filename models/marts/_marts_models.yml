version: 2

models:
  - name: fct_orders
    description: "Orders fact table with aggregated payment revenue and order status."
    columns:
      - name: order_id
        description: "Primary key identifier for the order."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key linking the order to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_amount
        description: "Total revenue amount recorded for the order."
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension table enriched with order history and lifetime value."
    columns:
      - name: customer_id
        description: "Primary key identifier for the customer."
        tests:
          - unique
          - not_null

      - name: lifetime_value
        description: "Total spend by the customer across all completed and recorded transactions."
        tests:
          - not_null

      - name: number_of_orders
        description: "Total count of orders placed by this customer."
        tests:
          - not_null